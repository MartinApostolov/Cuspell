name: Build Cuspell Windows font-compatibility test kit

on:
  push:
    branches: [fix/windows-ttf-rendering-test]
    paths:
      - '.github/workflows/cuspell-windows-font-test.yml'
      - 'assets/glyphs/references/idylwild/build_windows_compatible_font.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-font-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font tools and Latin fallback source
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          if ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Build distinct Windows PUA font and offline keyboard kit
        run: python assets/glyphs/references/idylwild/build_windows_compatible_font.py
      - name: Validate all glyph designs are unchanged and Windows font selectors exist
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from zipfile import ZipFile
          base=Path('assets/glyphs/references/idylwild')
          old=TTFont(base/'compact_font/CuspellCompact-Regular.ttf')
          new=TTFont(base/'windows_test_font/CuspellCompactWinTest-Regular.ttf')
          c1,c2=old.getBestCmap(),new.getBestCmap()
          assert all(c1[k]==c2[k] for k in c1)
          assert all(cp in c2 for cp in range(33,127))
          assert any(t.platformID==3 and t.platEncID==1 and t.isUnicode()
                     for t in new['cmap'].tables)
          assert new['OS/2'].fsSelection & 0x40
          assert new['OS/2'].ulCodePageRange1 & 1
          assert new['name'].getDebugName(1)=='Cuspell Compact WinTest'
          for cp in [*range(0xE000,0xE0EA),*map(ord,'.:?!«»$()_{},')]:
              name=c1[cp]
              g1,g2=old['glyf'][name],new['glyf'][name]
              assert g1.numberOfContours==g2.numberOfContours
              assert [tuple(p) for p in g1.coordinates]==[tuple(p) for p in g2.coordinates]
              assert old['hmtx'].metrics[name]==new['hmtx'].metrics[name]
          assert (base/'windows_test_font/meaning_keyboard.html').read_text().count('CuspellCompactWinTest-Regular') >= 2
          with ZipFile(base/'windows_test_font/Cuspell_Compact_WinTest_Kit.zip') as z:
              assert z.testzip() is None
              assert 'DEJAVU-LICENSE.txt' in z.namelist()
          print('PASS: original glyph drawings/codepoints/spacing, Latin fallback, Windows cmap and metadata')
          PY
      - name: Commit Windows PC test kit to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/glyphs/references/idylwild/windows_test_font/
          if ! git diff --cached --quiet; then
            git commit -m "Generate separate Windows font compatibility candidate"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload Windows test kit
        uses: actions/upload-artifact@v4
        with:
          name: Cuspell-Compact-Windows-Test-Kit
          path: assets/glyphs/references/idylwild/windows_test_font/Cuspell_Compact_WinTest_Kit.zip
          if-no-files-found: error
