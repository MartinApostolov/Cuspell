name: Historical manual Cuspell glyph recovery archive

# Historical source reconstruction only; do not rebuild superseded 150-glyph outputs on main pushes.
on:
  workflow_dispatch:

# Serialize archive rebuilds per branch, including main after merging recovery.
concurrency:
  group: glyph-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rebuild dependencies
        run: python -m pip install --disable-pip-version-check brotli fonttools shapely cairosvg pillow
      - name: Validate numbered glyph inventory
        run: python assets/glyphs/recovery/check_inventory.py
      - name: Upgrade recovered candidates using the original v0.14 R1 pack
        run: |
          python assets/glyphs/recovery/apply_v014r1.py
          python assets/glyphs/recovery/restore.py
          python assets/glyphs/recovery/make_review_sheets.py
      - name: Audit all 150 glyphs for visual similarity, mirrors, strokes, and 16px legibility
        run: python assets/glyphs/recovery/audit_glyphs.py
      - name: Archive generated font, SVGs, inventory and guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          base = Path('assets/glyphs/recovery/generated')
          archive = base / 'Cuspell_Glyph_Recovery_v0.19_150_glyphs.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(base.rglob('*')):
                  if p.is_file() and p != archive:
                      # Stable timestamps stop identical rebuilds from producing
                      # different archive bytes and redundant commits.
                      info = zipfile.ZipInfo(p.relative_to(base).as_posix(), date_time=(2026, 10, 20, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(info, p.read_bytes())
          print(f'Archive: {archive}, {archive.stat().st_size} bytes')
          PY
      - name: Persist complete rebuilt archive to triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/glyphs/recovery/restore.py assets/glyphs/recovery/source_geometry.json assets/glyphs/recovery/generated/
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild recovered 150-glyph source, fonts, guides and reviews [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
