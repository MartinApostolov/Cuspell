name: Build Cuspell glyph recovery archive

on:
  push:
    branches: [glyph-recovery-2026-10-20]
    paths:
      - 'assets/glyphs/recovery/payload/**'
      - 'assets/glyphs/recovery/bootstrap.py'
      - 'assets/glyphs/recovery/make_review_sheets.py'
      - '.github/workflows/cuspell-glyph-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rebuild dependencies
        run: python -m pip install --disable-pip-version-check brotli fonttools shapely cairosvg pillow
      - name: Restore editable source and rebuild 150 glyphs
        run: |
          python assets/glyphs/recovery/bootstrap.py
          python assets/glyphs/recovery/restore.py
          python assets/glyphs/recovery/make_review_sheets.py
      - name: Archive generated font, SVGs, inventory and guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          base = Path('assets/glyphs/recovery/generated')
          archive = base / 'Cuspell_Glyph_Recovery_v0.19_150_glyphs.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(base.rglob('*')):
                  if p.is_file() and p != archive:
                      z.write(p, p.relative_to(base))
          print(f'Archive: {archive}, {archive.stat().st_size} bytes')
          PY
      - name: Persist complete recoverable archive to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/glyphs/recovery/restore.py assets/glyphs/recovery/source_geometry.json assets/glyphs/recovery/generated/
          if ! git diff --cached --quiet; then
            git commit -m "Generate and preserve recovered 150-glyph source, fonts and previews"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
