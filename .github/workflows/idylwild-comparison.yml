name: Historical manual Idylwild comparison

# Original CC0 source import/comparison is historical; run explicitly if necessary.
on:
  workflow_dispatch:

# Only import on main; keep one authoritative copy of original bytes.
concurrency:
  group: idylwild-codex-import-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install comparison renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Retrieve source ZIPs from Idylwild's OpenGameArt releases
        shell: bash
        run: |
          set -euo pipefail
          dest="assets/glyphs/references/idylwild/original"
          mkdir -p "$dest"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 240 \
            --silent --show-error \
            "https://opengameart.org/sites/default/files/idylwilds_runic_codex.zip" \
            -o "$dest/idylwilds_runic_codex.zip"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 240 \
            --silent --show-error \
            "https://opengameart.org/sites/default/files/idylwilds_alchemical_codex.zip" \
            -o "$dest/idylwilds_alchemical_codex.zip"
          echo "1f5473b40e96fdaa980bc93993890a2f9e49d13ba0fdb6d5895bbacf5cb4cda5  $dest/idylwilds_runic_codex.zip" | sha256sum -c -
          echo "50ffd77d022dd0a62603f105dfc1b94ccff767e126622a3105ce03dc612dc055  $dest/idylwilds_alchemical_codex.zip" | sha256sum -c -

      - name: Test archive hashes, structure, and design counts
        run: python -m unittest discover -s tests -p "test_idylwild_reference_assets.py" -v

      - name: Generate indexed comparisons against all 150 Cuspell glyphs
        run: python assets/glyphs/references/idylwild/compare_codices.py

      - name: Persist verified original ZIPs and comparisons on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/glyphs/references/idylwild/original/idylwilds_runic_codex.zip \
            assets/glyphs/references/idylwild/original/idylwilds_alchemical_codex.zip \
            assets/glyphs/references/idylwild/reviews/01_runic_vs_alchemical.png \
            assets/glyphs/references/idylwild/reviews/02_runic_vs_alchemical_vs_cuspell.png \
            assets/glyphs/references/idylwild/reviews/comparison_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified CC0 codices and Cuspell comparison sheets [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
